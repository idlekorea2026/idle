<script>/* 인앱 브라우저(카카오톡 등)에서 confirm/alert가 막혀도 동작하는 자체 확인창 */
(function(){
  var cur=null;
  function show(msg,two){
    if(cur)return Promise.resolve(false);/* 이미 열려 있으면 중복 호출은 취소로 처리 */
    return new Promise(function(res){
      var prev=document.activeElement,t0=Date.now();
      var w=document.createElement('div');
      w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
      w.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none';
      var b=document.createElement('div');
      b.style.cssText='box-sizing:border-box;width:100%;max-width:360px;max-height:86%;overflow:auto;padding:16px;border:2px solid #3a4a48;border-radius:10px;background:#0a0f13;color:#e8f1ee;font-size:17px;line-height:1.5';
      var m=document.createElement('div');
      m.style.cssText='white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere';
      m.textContent=String(msg);
      var r=document.createElement('div');r.style.cssText='display:flex;gap:8px;margin-top:14px';
      function mk(txt,pri,v){
        var x=document.createElement('button');x.type='button';x.textContent=txt;
        x.style.cssText='flex:1;min-height:44px;padding:8px 10px;border-radius:8px;font:inherit;font-size:17px;cursor:pointer;border:2px solid '+(pri?'#5dff8a':'#3a4a48')+';background:'+(pri?'#5dff8a':'#17222a')+';color:'+(pri?'#06110f':'#e8f1ee');
        x.addEventListener('click',function(e){e.stopPropagation();if(v&&Date.now()-t0<300)return;fin(v)});
        return x;
      }
      var no=two?mk('취소',false,false):null,ok=mk('확인',true,true);
      if(no)r.appendChild(no);r.appendChild(ok);b.appendChild(m);b.appendChild(r);w.appendChild(b);
      function kd(e){
        if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();fin(false);return}
        if(e.key==='Tab'){e.preventDefault();e.stopImmediatePropagation();var a=document.activeElement;(no&&a===ok?no:ok).focus();return}
        e.stopImmediatePropagation();/* 확인창이 떠 있는 동안 게임 키 입력은 막아요 */
      }
      function fin(v){
        window.removeEventListener('keydown',kd,true);
        if(w.parentNode)w.parentNode.removeChild(w);
        cur=null;try{if(prev&&prev.focus)prev.focus()}catch(e){}
        res(v);
      }
      cur=w;window.addEventListener('keydown',kd,true);
      document.body.appendChild(w);
      try{ok.focus()}catch(e){}
    });
  }
  window.afAsk=function(msg){return show(msg,true)};
  window.afInfo=function(msg){return show(msg,false).then(function(){})};
})();
</script>

   (먼저 켜면 정책이 없어서 마을 연결이 거부돼요.) true 가 되면 로그인한 사람만 마을 채널에 붙고 보낼 수 있어요. */
const VL_PRIVATE=true;
const NET={ch:null,ok:0,last:0,pend:0,hold:0,tx:null,ka:0,gc:0,sx:1100,cl:{}};
const NMAX=20;
const nid=()=>AF.user?String(AF.user.id).slice(0,8):'';
const hue=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return h};
function netSend(ev,pl){if(!NET.ch||!NET.ok)return;try{NET.ch.send({type:'broadcast',event:ev,payload:pl})}catch(e){}}
function netPkt(t,h){const x=Math.round(curX());return{i:nid(),n:String(AF.nk||'모험가').slice(0,12),x:x,t:Math.round(t==null?x:t),d:dir,h:h?1:0,q:AF.vl&&AF.vl.ap?AF.vl.ap():''}}
function netGo(from,to){
  if(!NET.ch||!NET.ok)return;
  const now=performance.now(),holding=hd!==0,tg=holding?clamp(from+hd*700,MIN,MAX):to;
  NET.tx=tg;
  if(holding){if(NET.hold===hd&&now-NET.last<1200)return;NET.hold=hd}else NET.hold=0;
  if(!holding&&now-NET.last<250){if(!NET.pend)NET.pend=setTimeout(()=>{NET.pend=0;NET.last=performance.now();netSend('p',netPkt(NET.tx))},250-(now-NET.last));return}
  clearTimeout(NET.pend);NET.pend=0;NET.last=now;netSend('p',netPkt(tg));
}
function netOn(m){
  const o=m&&m.payload;if(!o||!o.i||o.i===nid())return;
  const id=String(o.i).slice(0,8),n=String(o.n||'모험가').slice(0,12),x=+o.x,t=+o.t;if(!isFinite(x)||!isFinite(t))return;
  const q=typeof o.q==='string'&&o.q.length<=60&&/^[0-9.,-]+$/.test(o.q)?o.q:'';/* 남의 겉모습(장비·망토·탈것): 숫자만 받아요 */
  const mk=()=>{const h=hue(id);return{name:n,x:x,dir:o.d>=0?1:-1,q:q,body:'hsl('+h+' 28% 36%)',hair:'hsl('+((h+40)%360)+' 35% 30%)',cape:'hsl('+((h+160)%360)+' 70% 62%)'}};
  let p=ppl[id];
  if(!p){if(Object.keys(ppl).length>=NMAX-1)return;AF.vlPeople.add(id,mk());p=ppl[id];
    if(o.h)setTimeout(()=>netSend('p',netPkt(NET.tx)),Math.random()*700)}/* 새로 들어온 사람에게 내 위치를 알려줘요 */
  if(q&&q!==p.q){if(p.q)AF.vlPeople.look(id,q);else{AF.vlPeople.add(id,mk());p=ppl[id]}}/* 새 버전으로 바뀐 사람은 그림으로 다시 그려요 */
  p.seen=Date.now();
  const nm=p.el.querySelector('.vco');if(nm&&nm.textContent!==n)nm.textContent=n;
  if(Math.abs(t-p.x)>0.5||Math.abs(x-p.x)>300){if(Math.abs(x-p.x)>300){p.el.style.transition='none';p.el.style.transform='translate3d('+(clamp(x,MIN,MAX)-20)+'px,0,0)';p.x=x}AF.vlPeople.move(id,t,o.d>=0?1:-1)}
}
/* 마을 채팅: 같은 마을 채널로만 보내요(저장 없음). 받는 쪽에서도 1초에 1줄까지만 받아요 */
function netChat(m){
  const o=m&&m.payload;if(!o||!o.i||o.i===nid()||typeof o.t!=='string')return;
  const id=String(o.i).slice(0,8),now=Date.now();if(now-(NET.cl[id]||0)<700)return;NET.cl[id]=now;
  const t=o.t.replace(/\s+/g,' ').trim().slice(0,60);if(!t)return;
  try{AF.CHAT&&AF.CHAT.recv({id:id+':v:'+now+':'+Math.random().toString(36).slice(2,6),ch:'vl',name:String(o.n||'모험가').slice(0,12),text:t,ts:now})}catch(e){}
  if(ppl[id])AF.vlPeople.say(id,t,4500);
}
AF.vlChat={send(t){if(!NET.ch||!NET.ok)return false;t=String(t).slice(0,60);netSend('c',{i:nid(),n:String(AF.nk||'모험가').slice(0,12),t:t});AF.vlPeople.say('me',t,4500);return true}};
/* private 채널은 로그인 토큰을 실시간 연결에 먼저 확실히 넘긴 뒤에 붙어요(토큰이 늦게 전달돼 연결이 거부되는 걸 막아요) */
function netStart(){
  if(NET.ch||NET.st||!AF.sb||!AF.user||document.hidden)return;
  if(!VL_PRIVATE){netStart0();return}
  NET.st=1;
  Promise.resolve().then(()=>AF.sb.auth.getSession()).then(r=>{const t=r&&r.data&&r.data.session&&r.data.session.access_token;if(t)AF.sb.realtime.setAuth(t)}).catch(()=>{}).then(()=>{NET.st=0;if(root&&root.classList.contains('on')&&!document.hidden)netStart0()})
}
function netStart0(){
  if(NET.ch||!AF.sb||!AF.user||document.hidden)return;
  NET.tx=px;
  try{NET.ch=AF.sb.channel('village',{config:{broadcast:{self:false},private:VL_PRIVATE}})
    .on('broadcast',{event:'p'},netOn)
    .on('broadcast',{event:'c'},netChat)
    .on('broadcast',{event:'g'},gmOn)
    .on('broadcast',{event:'b'},m=>{const o=m&&m.payload;if(o&&o.i&&ppl[String(o.i).slice(0,8)])AF.vlPeople.del(String(o.i).slice(0,8))})
    .subscribe(s=>{if(s==='SUBSCRIBED'){NET.ok=1;netSend('p',netPkt(NET.tx,1));gmResync()}else if(s==='CLOSED'||s==='CHANNEL_ERROR'||s==='TIMED_OUT'){NET.ok=0;if(s!=='CLOSED'){try{console.warn('[village] 채널 연결 실패:',s,VL_PRIVATE?'(private: SQL 정책을 실행했는지 확인)':'')}catch(e){}}}})}catch(e){NET.ch=null;return}
  NET.ka=setInterval(()=>netSend('p',netPkt(NET.tx)),60000);
  NET.gc=setInterval(()=>{const now=Date.now();for(const k of Object.keys(ppl))if(ppl[k].seen&&now-ppl[k].seen>150000)AF.vlPeople.del(k)},10000);
}
function netStop(){
  if(!NET.ch)return;
  clearInterval(NET.ka);clearInterval(NET.gc);clearTimeout(NET.pend);NET.pend=0;
  netSend('b',{i:nid()});
  const c=NET.ch;NET.ch=null;NET.ok=0;
  setTimeout(()=>{try{AF.sb.removeChannel(c)}catch(e){}},300);
  for(const k of Object.keys(ppl))AF.vlPeople.del(k);NET.cl={};
}
document.addEventListener('visibilitychange',()=>{if(!root||!root.classList.contains('on'))return;if(document.hidden)netStop();else{vact=performance.now();netStart()}});
/* 다른 유저 표시용 */
AF.vlPeople={
  add(id,o){build();this.del(id);const w=document.createElement('div');w.innerHTML=chr({name:o.name||'모험가',body:o.body||'#4a5a52',hair:o.hair||'#2a1f0c',cape:o.cape||'#8a6a30',q:o.q||''});const el=w.firstChild;el.style.transform='translate3d('+(clamp(o.x||1100,MIN,MAX)-20)+'px,0,0)';el.querySelector('.vf0').style.transform='scaleX('+(o.dir||1)+')';root.querySelector('#vppl').appendChild(el);ppl[id]={el,x:o.x||1100,q:o.q||''};if(o.q){const c=el.querySelector('.vdl');if(c)AF.vl.dq(c,o.q)}count()},
  look(id,q){const p=ppl[id];if(!p||p.q===q)return;p.q=q;const c=p.el.querySelector('.vdl');if(c)AF.vl.dq(c,q)},
  move(id,x,dirv){const p=ppl[id];if(!p)return;x=clamp(x,MIN,MAX);const d=Math.max(.35,Math.abs(x-p.x)/SPD);p.el.style.transition='transform '+d+'s linear';p.el.style.transform='translate3d('+(x-20)+'px,0,0)';p.el.querySelector('.vf0').style.transform='scaleX('+(dirv||(x>=p.x?1:-1))+')';p.el.classList.add('walk');clearTimeout(p.t);p.t=setTimeout(()=>p.el.classList.remove('walk'),d*1000);p.x=x},
  say(id,text,ms){const p=ppl[id]||(id==='me'?{el:me}:null);if(!p)return;const b=p.el.querySelector('.vsay');b.textContent=String(text).slice(0,60);clearTimeout(p.s);p.s=setTimeout(()=>{b.textContent=''},ms||4000)},
  del(id){const p=ppl[id];if(!p)return;clearTimeout(p.t);clearTimeout(p.s);p.el.remove();delete ppl[id];count()}
};
/* ===== 마을 오목 (재미용 · 서버 저장 없음 · 승패 보상 없음) =====
   마을에서 다른 사람을 눌러 신청 → 수락하면 시작해요. 같은 마을 채널의 'g' 이벤트로 주고받아요.
   15x15 자유 오목(5목 이상) · 한 수 30초 · 흑백은 수락할 때 랜덤 · 마을을 나가면 기권이에요.
   수 목록 전체를 매번 보내서, 패킷이 하나 빠져도 다음 전송에서 맞춰져요. */
const GM_N=15,GM_T=30000,GM_INV=20000;
let gm=null,gmI=null,gmR=null,gmC=null,gmEl=null,gmCv=null,gmCe=null,gmSel=-1,gmTk=0,gmBt=0,gmS=340;
const gmCool={};
const gmRid=()=>Math.random().toString(36).slice(2,8);
const gmMe=()=>String(AF.nk||'나').slice(0,12);
function gmMsg(t){try{toast(t,'#7dffe0')}catch(e){try{setInfo('',t)}catch(x){}}}
function gmSend(to,k,g,x){const o=x||{};o.i=nid();o.to=to;o.k=k;o.g=g;netSend('g',o)}

/* --- 다른 사람을 눌렀는지 --- */
function gmPick(e){
  if(gm)return true;
  gmC=null;
  for(const id in ppl){
    const el=ppl[id].el,t=el.querySelector('.vdl'),r0=(t||el).getBoundingClientRect(),k0=t?r0.width/200:1,r=t?{left:r0.left+25*k0,right:r0.right-25*k0,top:r0.top+50*k0,bottom:r0.bottom}:r0,px=t?0:14;
    if(e.clientX>=r.left-px&&e.clientX<=r.right+px&&e.clientY>=r.top-34&&e.clientY<=r.bottom+8){
      gmC={id:id,name:(el.querySelector('.vco')||{}).textContent||'모험가'};gmCard();return true}
  }
  gmCard();return false;
}

/* --- 신청 · 수락 카드 --- */
function gmCard(){
  if(!gmCe){
    gmCe=document.createElement('div');gmCe.id='gmkC';document.body.appendChild(gmCe);
    gmCe.addEventListener('click',e=>{
      const a=e.target&&e.target.dataset&&e.target.dataset.a;if(!a)return;e.stopPropagation();
      if(a==='inv')gmInvite();else if(a==='x')gmC=null;else if(a==='cn')gmCancel();else if(a==='ok')gmAccept();else if(a==='no')gmDecline();
      gmCard();
    });
  }
  let h='';
  if(gm)h='';
  else if(gmR)h='<div class="gmq"><b>'+esc(gmR.name)+'</b> 님이 오목을 신청했어요</div><div class="gmr"><button type="button" class="gmb g" data-a="ok">수락</button><button type="button" class="gmb" data-a="no">거절</button></div>';
  else if(gmI)h='<div class="gmq"><b>'+esc(gmI.name)+'</b> 님의 답을 기다리는 중…</div><div class="gmr"><button type="button" class="gmb" data-a="cn">취소</button></div>';
  else if(gmC)h='<div class="gmq"><b>'+esc(gmC.name)+'</b></div><div class="gmr"><button type="button" class="gmb g" data-a="inv">오목 신청</button><button type="button" class="gmb" data-a="x">닫기</button></div>';
  gmCe.innerHTML=h;gmCe.classList.toggle('on',!!h);
}
function gmInvite(){
  if(!gmC||gm||gmI||gmR)return;
  if(!NET.ok||!ppl[gmC.id]){gmMsg('상대가 보이지 않아요.');gmC=null;return}
  const g=gmRid(),id=gmC.id;
  gmI={to:id,g:g,name:gmC.name,t:setTimeout(()=>{if(gmI&&gmI.g===g){gmSend(id,'cn',g);const n=gmI.name;gmI=null;gmMsg(n+' 님이 응답하지 않았어요.');gmCard()}},GM_INV)};
  gmC=null;gmSend(id,'inv',g,{n:gmMe()});
}
function gmCancel(){if(!gmI)return;clearTimeout(gmI.t);gmSend(gmI.to,'cn',gmI.g);gmI=null}
function gmAccept(){
  if(!gmR)return;clearTimeout(gmR.t);const r=gmR;gmR=null;
  const b=Math.random()<.5?nid():r.from;
  gmSend(r.from,'acc',r.g,{b:b});gmStart(r.from,r.name,r.g,b===nid());
}
function gmDecline(why){if(!gmR)return;clearTimeout(gmR.t);gmSend(gmR.from,'dec',gmR.g,{r:why||''});gmR=null}

/* --- 받은 메시지 --- */
function gmOn(m){
  const o=m&&m.payload,me=nid();if(!o||!o.i||!me||o.to!==me)return;
  const from=String(o.i).slice(0,8),k=o.k,g=typeof o.g==='string'?o.g.slice(0,8):'';
  if(from===me||!g)return;
  if(k==='inv'){
    const now=Date.now();if(now-(gmCool[from]||0)<4000)return;gmCool[from]=now;
    if(gm||gmI||gmR){gmSend(from,'dec',g,{r:'busy'});return}
    gmR={from:from,g:g,name:String(o.n||'모험가').slice(0,12),t:setTimeout(()=>{if(gmR&&gmR.g===g){gmR=null;gmCard()}},GM_INV)};
    gmC=null;try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}gmCard();
  }else if(k==='cn'){
    if(gmR&&gmR.from===from&&gmR.g===g){clearTimeout(gmR.t);gmR=null;gmCard()}
  }else if(k==='dec'){
    if(gmI&&gmI.to===from&&gmI.g===g){clearTimeout(gmI.t);const n=gmI.name;gmI=null;gmMsg(o.r==='busy'?n+' 님은 지금 다른 일을 하고 있어요.':n+' 님이 거절했어요.');gmCard()}
  }else if(k==='acc'){
    if(gmI&&gmI.to===from&&gmI.g===g&&!gm){const b=String(o.b||'');if(b!==me&&b!==from)return;clearTimeout(gmI.t);const n=gmI.name;gmI=null;gmStart(from,n,g,b===me)}
  }else if(gm&&gm.opp===from&&gm.g===g){
    if(k==='mv')gmRecv(o);
    else if(k==='syn'){if(gm.moves.length)gmSendMv()}
    else if(k==='end'){
      if(gm.over)return;const w=String(o.w||'');if(w!==me&&w!==from)return;
      const r=String(o.r||'');gmEnd(w===me?'win':'lose',r==='time'?'time':r==='left'?'left':'resign');
    }
  }
}
function gmResync(){if(gm&&!gm.over)gmSend(gm.opp,'syn',gm.g)}

/* --- 대국 --- */
function gmStart(opp,name,g,black){
  gm={g:g,opp:opp,oppName:name,role:black?'b':'w',bd:new Int8Array(GM_N*GM_N),moves:[],turn:'b',dl:Date.now()+GM_T+3000,over:0,res:'',why:'',win:null,last:-1,ls:0};
  gmSel=-1;gmC=null;gmCard();gmBuild();
  const rs=$('gmrs');if(gmBt){clearTimeout(gmBt);gmBt=0}rs.textContent='기권';
  gmEl.classList.add('on');gmFit();gmUi();
  clearInterval(gmTk);gmTk=setInterval(gmTick,250);
}
function gmExit(){clearInterval(gmTk);gmTk=0;if(gmBt){clearTimeout(gmBt);gmBt=0}gm=null;gmSel=-1;if(gmEl)gmEl.classList.remove('on');gmCard()}
/* 마을을 나가면 기권 · 대기 중인 신청도 정리해요 */
function gmAbort(){
  if(gmR)gmDecline('');
  if(gmI)gmCancel();
  if(gm&&!gm.over)gmSend(gm.opp,'end',gm.g,{w:gm.opp,r:'left'});
  if(gm)gmExit();
  gmC=null;gmCard();
}
function gmWin(idx,col){
  const N=GM_N,r=(idx/N)|0,c=idx%N;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const line=[idx];
    for(const sg of [1,-1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<N&&cc>=0&&cc<N&&gm.bd[rr*N+cc]===col){line.push(rr*N+cc);rr+=dr*sg;cc+=dc*sg}}
    if(line.length>=5)return line;
  }
  return null;
}
function gmApply(idx,col){
  gm.bd[idx]=col;gm.moves.push(idx);gm.last=idx;gmSel=-1;
  const w=gmWin(idx,col),mine=col===(gm.role==='b'?1:2);
  if(w){gm.win=w;gmEnd(mine?'win':'lose','five')}
  else if(gm.moves.length>=GM_N*GM_N)gmEnd('draw','full');
  else{gm.turn=gm.turn==='b'?'w':'b';gm.dl=Date.now()+GM_T;gmUi();gmDraw()}
}
function gmEnd(res,why){if(!gm||gm.over)return;gm.over=1;gm.res=res;gm.why=why;gmSel=-1;gmUi();gmDraw()}
function gmSendMv(){if(!gm)return;gmSend(gm.opp,'mv',gm.g,{m:gm.moves.join(',')});gm.ls=Date.now()}
function gmPlace(idx){
  if(!gm||gm.over||gm.turn!==gm.role||gm.bd[idx])return;
  const g=gm.g;gmApply(idx,gm.role==='b'?1:2);gmSendMv();
  if(gm.over&&gm.res==='win'){[900,2200].forEach(d=>setTimeout(()=>{if(gm&&gm.g===g)gmSendMv()},d))}
}
function gmRecv(o){
  if(gm.over||gm.turn===gm.role||!o.m)return;
  const a=String(o.m).split(',').map(Number);
  if(a.length!==gm.moves.length+1||a.length>GM_N*GM_N)return;
  for(let i=0;i<gm.moves.length;i++)if(a[i]!==gm.moves[i])return;
  const idx=a[a.length-1];if(!Number.isInteger(idx)||idx<0||idx>=GM_N*GM_N||gm.bd[idx])return;
  gmApply(idx,gm.role==='b'?2:1);
}
function gmTick(){
  if(!gm||gm.over)return;
  const left=gm.dl-Date.now(),mine=gm.turn===gm.role;
  if(mine&&left<=0){gmSend(gm.opp,'end',gm.g,{w:gm.opp,r:'time'});gmEnd('lose','time');return}
  if(!mine&&left<-8000){gmSend(gm.opp,'end',gm.g,{w:nid(),r:'time'});gmEnd('win','time');return}
  if(!mine&&gm.moves.length&&Date.now()-gm.ls>4000)gmSendMv();/* 상대가 내 수를 놓쳤을 때를 위해 다시 알려요 */
  gmUi();
}

/* --- 화면 --- */
function gmBuild(){
  if(gmEl)return;
  gmEl=document.createElement('div');gmEl.id='gmk';gmEl.className='ov';
  gmEl.innerHTML='<div class="gmw"><div class="gmh"><div class="gmp" id="gmpb"><i class="gms b"></i><span></span></div><div class="gmt" id="gmt"></div><div class="gmp" id="gmpw"><i class="gms w"></i><span></span></div></div><canvas id="gmc"></canvas><div class="gmst" id="gmst"></div><div class="gmbt"><button type="button" class="gmb g" id="gmok">두기</button><button type="button" class="gmb" id="gmrs">기권</button><button type="button" class="gmb g" id="gmx" hidden>닫기</button></div></div>';
  document.body.appendChild(gmEl);
  gmCv=$('gmc');
  gmCv.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(!gm||gm.over||gm.turn!==gm.role)return;
    const r=gmCv.getBoundingClientRect(),u=r.width/GM_N,c=Math.floor((e.clientX-r.left)/u),w=Math.floor((e.clientY-r.top)/u);
    if(c<0||c>=GM_N||w<0||w>=GM_N)return;
    const idx=w*GM_N+c;if(gm.bd[idx])return;
    if(gmSel===idx){gmPlace(idx);return}
    gmSel=idx;gmDraw();gmUi();
  });
  $('gmok').addEventListener('click',()=>{if(gmSel>=0)gmPlace(gmSel)});
  $('gmrs').addEventListener('click',()=>{
    if(!gm||gm.over)return;const b=$('gmrs');
    if(gmBt){clearTimeout(gmBt);gmBt=0;b.textContent='기권';gmSend(gm.opp,'end',gm.g,{w:gm.opp,r:'resign'});gmEnd('lose','resign')}
    else{b.textContent='정말 기권?';gmBt=setTimeout(()=>{gmBt=0;b.textContent='기권'},3000)}
  });
  $('gmx').addEventListener('click',gmExit);
  addEventListener('resize',()=>{if(gm)gmFit()});
}
function gmFit(){
  const S=Math.max(240,Math.floor(Math.min(innerWidth*.94,innerHeight-200,560))),d=window.devicePixelRatio||1;
  gmS=S;gmEl.style.setProperty('--gs',S+'px');gmCv.width=Math.round(S*d);gmCv.height=Math.round(S*d);gmDraw();
}
function gmDraw(){
  if(!gmCv||!gm)return;
  const N=GM_N,S=gmS,u=S/N,c=gmCv.getContext('2d');
  c.setTransform(gmCv.width/S,0,0,gmCv.width/S,0,0);c.clearRect(0,0,S,S);
  c.fillStyle='#c99a52';c.fillRect(0,0,S,S);
  c.strokeStyle='#4a3512';c.lineWidth=1;c.beginPath();
  for(let i=0;i<N;i++){const p=(i+.5)*u;c.moveTo(p,.5*u);c.lineTo(p,(N-.5)*u);c.moveTo(.5*u,p);c.lineTo((N-.5)*u,p)}
  c.stroke();
  c.fillStyle='#4a3512';for(const [a,b] of [[3,3],[3,11],[7,7],[11,3],[11,11]]){c.beginPath();c.arc((a+.5)*u,(b+.5)*u,u*.1,0,7);c.fill()}
  const xy=i=>[(i%N+.5)*u,(((i/N)|0)+.5)*u];
  const stone=(i,col,al)=>{
    const [x,y]=xy(i),r=u*.44,g=c.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    c.globalAlpha=al||1;
    if(col===1){g.addColorStop(0,'#5a5a5a');g.addColorStop(1,'#0a0a0a')}else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cbc7b8')}
    c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.lineWidth=1;c.strokeStyle=col===1?'#000':'#8a7a5a';c.stroke();c.globalAlpha=1;
  };
  for(let i=0;i<N*N;i++)if(gm.bd[i])stone(i,gm.bd[i]);
  if(gm.last>=0){const [x,y]=xy(gm.last);c.strokeStyle='#ff5a2a';c.lineWidth=2;c.beginPath();c.arc(x,y,u*.18,0,7);c.stroke()}
  if(gm.win){c.strokeStyle='#ffb84a';c.lineWidth=3;for(const i of gm.win){const [x,y]=xy(i);c.beginPath();c.arc(x,y,u*.48,0,7);c.stroke()}}
  if(gmSel>=0&&!gm.over&&gm.turn===gm.role&&!gm.bd[gmSel])stone(gmSel,gm.role==='b'?1:2,.55);
}
const GM_TXT={
  win:{five:'다섯 줄을 먼저 완성했어요. 승리!',time:'상대가 시간 안에 두지 않았어요. 승리!',left:'상대가 나갔어요. 승리!',resign:'상대가 기권했어요. 승리!'},

    return'<div class="or'+(x.me?' me':'')+'"><span>'+(x.role!=='member'?'<i class="rl '+x.role+'">'+RN[x.role]+'</i>':'')+esc(x.name)+(x.lv?' <small style="display:inline">Lv.'+x.lv+'</small>':'')+'<small>이번 주 '+nf(x.wk)+' · 누적 '+nf(x.c)+seenTxt(x)+'</small></span>'+a+'</div>'}).join('')};

const vReq=()=>{if(!G.reqs)return'<div class="em">불러오는 중…</div>';if(!G.reqs.length)return'<div class="em">대기 중인 가입 신청이 없어요</div>';
  return G.reqs.map(x=>U.test(x.uid)?'<div class="or"><span>'+esc(x.name)+'<small>'+(x.lv!=null?'Lv.'+x.lv+(x.cp!=null?' · 전투력 '+nf(x.cp):'')+' · ':'')+new Date(x.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' 신청</small></span><button class="tg on" data-g="ok:'+x.uid+'"'+(G.busy?' disabled':'')+'>수락</button><button class="tg dg" data-g="no:'+x.uid+'"'+(G.busy?' disabled':'')+'>거절</button></div>':'').join('')};

const vRank=()=>{if(!G.rank)return'<div class="em">불러오는 중…</div>';const L=G.rank.list||[];
  return'<div class="nt">이번 주(월~일, 한국 시간) 길드원의 월드보스 피해를 합산해요 · 가입한 날 다음 날부터 반영돼요</div>'
   +(L.length?L.map(x=>'<div class="or'+(x.me?' me':'')+'"><span class="no t'+(x.rk<=3?x.rk:0)+'" style="flex:none">'+x.rk+'</span><span><b style="color:#ffd98a;font-weight:400">Lv.'+x.lv+'</b> '+esc(x.name)+'<small>'+x.n+'명</small></span><b style="min-width:84px" title="'+nf(x.dmg)+'">'+(AF.kn?AF.kn(x.dmg):nf(x.dmg))+'</b></div>').join(''):'<div class="em">아직 길드가 없어요</div>')};

const vSet=()=>{const m=G.me,off=m.role==='member';
  let h='';
  if(!off)h+='<h3>공지<small>100자 · 길드 정보 화면에 보여요</small></h3><textarea id="gt" maxlength="100" placeholder="길드원에게 알릴 내용을 적어 주세요">'+esc(G.nt)+'</textarea><button class="big" data-g="sv"'+(G.busy?' disabled':'')+' style="height:38px;font-size:16px">공지 저장</button>';
  if(m.role==='leader')h+='<h3>가입 방식</h3><div class="or"><span>지금: '+(m.mode=='free'?'자유 가입':'승인제')+'<small>자유로 바꾸면 대기 중인 신청은 모두 사라져요</small></span><button class="tg on" data-g="sm"'+(G.busy?' disabled':'')+'>'+(m.mode=='free'?'승인제로':'자유 가입으로')+'</button></div>';
  h+='<h3 style="color:#ff7a7a">탈퇴</h3><div class="or"><span style="color:#ff8a8a">길드 나가기<small style="color:#d97a7a">'+(m.role==='leader'?(m.n>1?'길장은 부길장 → 공헌도 높은 길드원 순으로 자동 위임돼요':'혼자 남은 길드는 해체돼요'):(AF.isAdmin?'관리자는 나간 뒤 대기시간이 없어요':'나간 뒤 한동안 다른 길드에 가입할 수 없어요'))+'</small></span><button class="tg dg" data-g="lv"'+(G.busy?' disabled':'')+'>탈퇴</button></div>';
  return h};

const BODY={find:vFind,make:vMake,info:vInfo,ros:vRos,req:vReq,rank:vRank,set:vSet};
const tabOk=()=>{const t=tabs();return !G.me||!t.length||t.some(x=>x[0]===G.tab)};
function draw(){const bd=gd.querySelector('.bd'),sp=bd?bd.scrollTop:0,m=G.me;if(m&&!tabOk())G.tab=tabs()[0][0];
  const T=tabs().map(([k,n])=>'<button class="'+(G.tab===k?'on':'')+'" data-g="tab:'+k+'">'+n+'</button>').join('');
  let body;try{body=!m?'<div class="em">'+(G.msg&&G.bad?esc(G.msg):'불러오는 중…')+'</div>':(BODY[G.tab]||(()=>''))()}catch(e){body='<div class="em">화면을 불러오지 못했어요<br>닫았다가 다시 열어 주세요</div>'}
  gd.innerHTML='<div class="pn"><h2>길드</h2><div class="st">'+(m&&m.in?esc(m.name)+' · Lv.'+m.lv:'함께 성장할 동료를 찾아보세요')+'</div><div class="tb">'+T+'</div><div class="bd">'+body+'</div><div class="msg'+(G.bad?' bad':'')+'">'+(m?esc(G.msg):'')+'</div><div class="mb bk"><button class="pri" data-g="x">닫기</button></div></div>';
  const nb=gd.querySelector('.bd');if(nb)nb.scrollTop=sp}
const say=(t,bad)=>{G.msg=t;G.bad=bad?1:0};
const settle=()=>{if(tabOk())draw();else{G.list=null;G.roster=G.reqs=G.rank=null;tabTo(tabs()[0][0])}};
async function refresh(){if(!gd.classList.contains('on'))return;try{apply(await rpc('guild_me'))}catch(e){return}if(gd.classList.contains('on'))settle()}
const fail=e=>{say(em(e),1);if(/^(no_guild|forbidden|nogd|nomember)$/.test(String(e&&e.message||'').trim()))refresh()};

async function tabTo(t){const k=++G.tok;G.tab=t;say('');draw();
  try{if(t==='find'&&G.list===null)await loadList(0);
    else if(t==='ros')G.roster=await rpc('guild_roster');
    else if(t==='req')G.reqs=await rpc('guild_reqs');
    else if(t==='rank')G.rank=await rpc('guild_rank');
    else if(t==='set')G.nt=G.me.notice||''}catch(e){if(k===G.tok)fail(e)}
  if(k===G.tok)draw()}
let sq=0;
async function loadList(off){const s=sq,d=await rpc('guild_list',{p_q:G.q.trim()||null,p_off:off});if(s!==sq)return;G.list=off?(G.list||[]).concat(d):d;G.more=d.length>=20}
async function run(f){if(G.busy)return;G.busy=1;say('');draw();try{await f()}catch(e){fail(e)}G.busy=0;draw()}

async function open(){G.tok++;gd.classList.add('on');G.me=null;G.tab='';G.list=null;G.roster=G.reqs=G.rank=null;say('');draw();
  try{apply(await rpc('guild_me'))}catch(e){fail(e);draw();return}
  await tabTo(G.me.in?'info':'find');
  if(G.me&&G.me.in){try{const r=await rpc('guild_act');apply(r);if(r.got>0)say('오늘의 활동 공헌도 +'+r.got);if(G.tab==='info')draw()}catch(e){}}}
function close(){G.tok++;gd.classList.remove('on');gd.innerHTML=''}
AF.openGd=open;AF.gdTag=()=>G.me&&G.me.in?{n:G.me.name,l:G.me.lv}:null;

const search=()=>{const i=$('gq');if(i)G.q=i.value;sq++;G.list=null;draw();loadList(0).then(()=>draw(),e=>{fail(e);G.list=[];draw()})};
const more=()=>run(async()=>{await loadList((G.list||[]).length)});
const goIn=async t=>{G.list=null;G.roster=G.reqs=G.rank=null;await tabTo(t)};

const join=id=>run(async()=>{const r=await rpc('guild_join',{p_id:id});
  if(r&&r.st==='joined'){apply(await rpc('guild_me'));G.busy=0;await goIn('info');say('길드에 가입했어요!');return}
  const x=(G.list||[]).find(z=>z.id===id);if(x)x.req=true;apply(await rpc('guild_me'));say('가입 신청을 보냈어요. 수락을 기다려 주세요')});
const adminMove=async id=>{const m=G.me,x=(G.list||[]).find(z=>z.id===id);if(!x)return;
  const warn=m&&m.in&&m.role==='leader'&&m.n<=1?'\n(혼자 남은 길드라서 지금 길드는 해체돼요)':m&&m.in&&m.role==='leader'?'\n(지금 길드의 길장은 다른 길드원에게 자동 위임돼요)':'';
  if(!await afAsk('"'+x.name+'" 길드로 이동할까요?'+warn))return;
  run(async()=>{apply(await rpc('guild_admin_move',{p_id:id}));G.busy=0;await goIn('info');say('"'+x.name+'" 길드로 이동했어요')})};
const cancel=id=>run(async()=>{await rpc('guild_cancel_req',{p_id:id});const x=(G.list||[]).find(z=>z.id===id);if(x)x.req=false;apply(await rpc('guild_me'));say('신청을 취소했어요')});
const make=async()=>{const nm=(G.mk.name||'').trim(),c=mkCost();
  if(!/^[0-9A-Za-z가-힣]{2,10}$/.test(nm)){say('길드 이름은 한글·영문·숫자 2~10자예요',1);draw();return}
  if(AF.gld.gold()<c){say('골드가 부족해요 ('+nf(c)+' G 필요)',1);draw();return}
  if(!await afAsk('"'+nm+'" 길드를 '+nf(c)+' G 에 만들까요?'))return;
  run(async()=>{const r=await rpc('guild_create',{p_name:nm,p_mode:G.mk.mode});AF.gld.spend(c);apply(r);G.busy=0;await goIn('info');say('길드를 만들었어요!')})};
const donate=t=>{const c=donCost(t-1);if(AF.gld.gold()<c){say('골드가 부족해요',1);draw();return}
  run(async()=>{const r=await rpc('guild_donate',{p_tier:t});AF.gld.spend(c);apply(r);say('기부했어요 · 공헌도 +'+r.got)})};
const actNow=()=>run(async()=>{const r=await rpc('guild_act');apply(r);say(r.got>0?'활동 공헌도 +'+r.got:'받을 활동 공헌도가 없어요. 출석·월드보스·던전을 먼저 해 보세요')});
const role=async(uid,rl)=>{if(!U.test(uid))return;const x=(G.roster||[]).find(z=>z.uid===uid),n=x?x.name:'이 길드원';
  const oc=(G.roster||[]).filter(z=>z.role==='officer').length,aft=(x&&x.role==='officer')||(G.me.omax!=null&&oc<G.me.omax)?'부길장':'일반 길드원';
  const q=rl==='leader'?'길장을 '+n+' 님에게 넘길까요?\n나는 '+aft+'이 돼요.':rl==='officer'?n+' 님을 부길장으로 임명할까요?':n+' 님을 부길장에서 해임할까요?';if(!await afAsk(q))return;
  run(async()=>{await rpc('guild_role',{p_uid:uid,p_role:rl});apply(await rpc('guild_me'));G.roster=await rpc('guild_roster');say(rl==='leader'?'길장을 넘겼어요':rl==='officer'?'부길장으로 임명했어요':'부길장에서 해임했어요')})};
const kick=async uid=>{if(!U.test(uid))return;const x=(G.roster||[]).find(z=>z.uid===uid);if(!await afAsk((x?x.name:'이 길드원')+' 님을 추방할까요?\n추방된 사람은 한동안 다시 가입할 수 없어요.'))return;
  run(async()=>{await rpc('guild_kick',{p_uid:uid});G.roster=await rpc('guild_roster');apply(await rpc('guild_me'));say('추방했어요')})};
const decide=(uid,ok)=>{if(!U.test(uid))return;
  run(async()=>{try{await rpc('guild_decide',{p_uid:uid,p_ok:ok})}catch(e){if(!/noreq|in_guild|full/.test(String(e&&e.message)))throw e;say(em(e),1)}
    G.reqs=await rpc('guild_reqs');apply(await rpc('guild_me'));if(!G.bad)say(ok?'가입을 수락했어요':'신청을 거절했어요')})};
const saveNote=()=>{const t=$('gt');if(t)G.nt=t.value;run(async()=>{apply(await rpc('guild_set',{p_notice:G.nt}));say('공지를 저장했어요')})};
const setMode=async()=>{const to=G.me.mode=='free'?'approve':'free';if(to==='free'&&!await afAsk('자유 가입으로 바꾸면 대기 중인 신청이 모두 사라져요. 바꿀까요?'))return;
  run(async()=>{apply(await rpc('guild_set',{p_mode:to}));say(to==='free'?'자유 가입으로 바꿨어요':'승인제로 바꿨어요')})};
const leave=async()=>{const m=G.me;if(!await afAsk(m.role==='leader'&&m.n<=1?'길드를 해체하고 나갈까요? 되돌릴 수 없어요.':'정말 "'+m.name+'" 길드를 나갈까요?\n나간 뒤 한동안 다른 길드에 가입할 수 없어요.'))return;
  run(async()=>{await rpc('guild_leave');apply(await rpc('guild_me'));G.busy=0;await goIn('find');say('길드에서 나왔어요')})};

gd.addEventListener('click',e=>{if(e.target===gd&&dn===gd){close();return}const b=e.target.closest('[data-g]');if(!b||b.disabled)return;const[a,p,q]=b.dataset.g.split(':');
  if(a==='x')close();else if(a==='tab')tabTo(p);else if(a==='q')search();else if(a==='more')more();else if(a==='j')join(+p);else if(a==='cx')cancel(+p);else if(a==='am')adminMove(+p);
  else if(a==='md'){G.mk.mode=G.mk.mode=='free'?'approve':'free';draw()}else if(a==='mk')make();else if(a==='d')donate(+p);else if(a==='act')actNow();
  else if(a==='r')role(p,q);else if(a==='k')kick(p);else if(a==='ok')decide(p,true);else if(a==='no')decide(p,false);else if(a==='sv')saveNote();else if(a==='sm')setMode();else if(a==='lv')leave()});
let dn=null;gd.addEventListener('pointerdown',e=>{dn=e.target===gd?gd:null},true);
gd.addEventListener('input',e=>{const t=e.target;if(t.id==='gq')G.q=t.value;else if(t.id==='gn')G.mk.name=t.value;else if(t.id==='gt')G.nt=t.value});
gd.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){e.stopPropagation();if(e.key==='Enter'&&e.target.id==='gq'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();search()}}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&gd.classList.contains('on')){if(document.querySelector('[role="dialog"][aria-modal="true"]'))return;/* 확인창이 떠 있으면 확인창이 먼저 Esc를 처리해요 */e.preventDefault();e.stopImmediatePropagation();close()}},true);

/* 길드 버프는 패널을 열지 않아도 적용돼야 해서, 로그인 직후와 10분마다 내 길드 상태만 살짝 확인해요 */
const tst=t=>{try{AF.toast(t,'#7dffe0')}catch(e){}};
const notice=(o,n)=>{if(!o||!n)return 0;
  if(!o.in&&n.in){tst('길드 \"'+n.name+'\"에 가입됐어요!');return 1}
  if(o.in&&!n.in){tst(n.why==='kick'?'길드에서 추방됐어요':n.why==='leave'?'길드에서 나왔어요':'길드가 해체됐어요');return 1}
  if(o.in&&n.in&&o.id!==n.id){tst('길드가 바뀌었어요');return 1}
  if(o.in&&n.in&&o.role!==n.role){tst(n.role==='leader'?'길장이 되었어요':'내 직책이 '+RN[n.role]+'(으)로 바뀌었어요');return 1}
  return 0};
/* 길드원이면 guild_act로 한 번에 갱신(공헌 반영 + 내 상태), 아니면 guild_me. 호출 횟수는 그대로예요 */
const sync=async()=>{if(!AF.sb||!AF.user||document.hidden)return;const o=G.me;let n;
  try{try{n=await rpc(o&&o.in?'guild_act':'guild_me')}catch(e){if(o&&o.in&&/no_guild/.test(String(e&&e.message)))n=await rpc('guild_me');else throw e}
    apply(n);if(n&&n.got>0)tst('길드 활동 공헌도 +'+n.got);
    const ch=notice(o,n);if(ch){G.list=null;G.roster=G.reqs=G.rank=null}
    if(gd.classList.contains('on')&&(ch||!tabOk()))settle()}catch(e){}};
addEventListener('af-user',()=>{AF.gb=0;G.me=null;try{AF.CHAT&&AF.CHAT.gdMode&&AF.CHAT.gdMode(false)}catch(e){}G.list=null;G.roster=G.reqs=G.rank=null;if(gd.classList.contains('on'))close();if(AF.user)setTimeout(sync,3000)});
setInterval(sync,600000);setTimeout(sync,6000);
})();
</script>
<script>/* ===== 출석체크 ===== */
(function(){const A=window.AF;if(!A)return;
const st=document.createElement('style');st.textContent='#atd{position:fixed;inset:0;z-index:9600;background:#02060af2;color:#e8f1ee;overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 24px);font:15px/1.5 "Do Hyeon",sans-serif}#atd.on{display:block}#atd .w{max-width:460px;margin:0 auto}#atd h2{margin:0 0 4px;font-size:20px}#atd .s{opacity:.75;font-size:13px;margin-bottom:10px}#atd .g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}#atd .d{border:1px solid #3a4a52;border-radius:8px;background:#121c22;padding:4px 1px;text-align:center;font-size:11px;line-height:1.25;min-height:54px}#atd .d b{display:block;font-size:12px;color:#cfe}#atd .d.ok{opacity:.45;background:#17301f;border-color:#2f6a42}#atd .d.nx{border-color:#ffd84a;box-shadow:0 0 0 1px #ffd84a inset}#atd .d.bg{border-color:#7a5cff}#atd .t{background:#121c22;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}#atd button{font:inherit;border-radius:8px;border:1px solid #5a4423;background:#1b2730;color:#e8f1ee;padding:10px 14px;cursor:pointer}#atd .c{width:100%;background:#2a5a3a;border-color:#4fa06a;font-size:16px;padding:12px;margin-top:6px}#atd .c:disabled{opacity:.5;cursor:default}#atd .x{width:100%;margin-top:10px}';document.head.appendChild(st);
const o=document.createElement('div');o.id='atd';o.setAttribute('role','dialog');o.setAttribute('aria-label','출석체크');document.body.appendChild(o);
let S=null,msg='',busy=0;
const e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rw(t){const a=[];if(t.c)a.push('코인'+t.c);if(t.rr)a.push('쿠폰'+t.rr);if(t.mu)a.push('강화권'+t.mu);if(t.dg)a.push('던전'+t.dg);if(t.bd)a.push('테두리');return a.join('<br>')}
function paint(){if(!S){o.innerHTML='<div class="w"><h2>출석체크</h2><div class="s">'+e(msg||'불러오는 중…')+'</div><button class="x" data-z="x">닫기</button></div>';return}
const cur=S.done?(S.prog|0):(S.prog|0)+1;/* prog: 지금까지 받은 칸(1~28) */
let g='';for(const t of S.tiers){const got=t.day<=(S.prog|0);const nx=!S.done&&t.day==cur;g+='<div class="d'+(got?' ok':'')+(nx?' nx':'')+(t.bd?' bg':'')+'"><b>'+t.day+'일</b>'+rw(t)+'</div>'}
o.innerHTML='<div class="w"><h2>출석체크</h2><div class="s">누적 '+(S.total|0)+'일 · 28일마다 처음부터 다시 시작해요 · 매일 한국 시간 0시에 출석이 초기화돼요</div>'
+'<div class="t">보유: 던전 추가 입장권 <b>'+(S.dg|0)+'</b>장 · 탈것 강화권 <b>'+((A.WB&&A.WB.mu)|0)+'</b>장'+(S.bd_got?' · 출석 테두리 획득함':'')+'</div>'
+'<div class="g">'+g+'</div>'+(msg?'<div class="t">'+e(msg)+'</div>':'')
+'<button class="c" data-z="c"'+(S.done||busy?' disabled':'')+'>'+(S.done?'오늘은 이미 출석했어요':busy?'받는 중…':'오늘 출석 보상 받기')+'</button>'
