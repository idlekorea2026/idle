if(!sv)return;const t1=Date.now();CSK=sv-(t0+t1)/2;if(M.abs(CSK)<5000)CSK=0;
if(st==0&&lts){const o=(tnow()-lts)/1000;OR=null;og=0;ogs='';ot=o>60?M.min(o,OFF.max):0;if(ot)offCalc();else ot=0}}catch(e){}};

/* ===== 접속자 수 (로그인한 사람만 센다) — 실시간 연결(Realtime/Presence)은 쓰지 않고, 접속자당 1분에 요청 1번(heartbeat)만 보내요.
   서버: online_users 표 + heartbeat() 함수가 필요해요 (online_users.sql). 아직 안 만들었으면 표시만 조용히 꺼져요. ===== */
let onN=0,onT=0,onErr=0,onLast=0,onOff=0;

async function beat(){onLast=Date.now();if(onOff||!sb||!AF.user)return;
  try{const r=await sb.rpc('heartbeat');if(r.error)throw r.error;onErr=0;const n=+r.data;if(n>0){onN=n;onShow()}}
  catch(e){onErr++;const m=String((e&&e.message)||'');if(e&&(e.code==='PGRST202'||e.code==='42883'||/Could not find the function|does not exist/i.test(m))){onOff=1;onN=0;onShow();console.warn('접속자 수: heartbeat 함수가 없어요 (online_users.sql 실행 필요)')}}}
function onLoop(){clearTimeout(onT);if(onOff||!AF.user)return;const base=(document.hidden?180000:120000)*(onErr>=3?4:1);onT=setTimeout(()=>{beat().then(onLoop,onLoop)},base+Math.random()*8000)}

<script>
/* ===== 채팅 (뼈대) — PC 게임식: Enter로 입력창 열기, Enter 전송, Esc 닫기, ↑↓ 이전 입력, Tab 탭 전환 =====
   지금은 서버 없이 이 브라우저 안에서만 동작해요(로컬 모드). 서버는 아래 ChatNet 자리만 갈아 끼우면 돼요.

   ▼ Supabase 연결 메모 (나중에)
   create table chat_messages(
     id bigint generated always as identity primary key,
     ch text not null default 'chat',
     uid uuid not null default auth.uid(),
     name text not null check (char_length(name) between 2 and 12),
     text text not null check (char_length(text) between 1 and 100),
     created_at timestamptz not null default now());
   alter table chat_messages enable row level security;
   -- 읽기: 로그인 유저 전체 · 쓰기: uid = auth.uid() 인 본인 것만 · 수정/삭제 없음
   alter publication supabase_realtime add table chat_messages;
   CHAT.net = {
     mode:'supabase',
     connect(onMsg){ sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},
                       p=>onMsg({id:p.new.id,ch:p.new.ch,uid:p.new.uid,name:p.new.name,text:p.new.text,ts:Date.parse(p.new.created_at)})).subscribe(); return Promise.resolve() },
     send(m){ return sb.from('chat_messages').insert({ch:m.ch,name:m.name,text:m.text}).then(r=>{ if(r.error) throw r.error }) },
     history(ch,n){ return sb.from('chat_messages').select().eq('ch',ch).order('id',{ascending:false}).limit(n).then(r=>(r.data||[]).map(x=>({id:x.id,ch:x.ch,uid:x.uid,name:x.name,text:x.text,ts:Date.parse(x.created_at)}))) } };
   CHAT.me.id = 로그인한 유저 id · CHAT.me.name = 닉네임 · CHAT.start() 를 다시 호출하면 연결돼요.
   서버 쪽에서도 길이·도배 제한을 꼭 걸어 주세요(클라이언트 제한은 우회 가능). */
(function(){
const $=id=>document.getElementById(id),box=$('cht'),lg=$('chlg'),ct=$('chct'),inp=$('chin'),hud=$('hud');
const TABS=[{id:'all',n:'전체',f:()=>true},{id:'chat',n:'채팅',f:m=>m.ch==='chat'},{id:'sys',n:'시스템',f:m=>m.ch==='sys'}];/* 탭 추가: 길드·귓속말 등은 여기 한 줄 + 메시지의 ch 값만 늘리면 돼요 */
const LIM={len:100,gap:1000,dup:5000,keep:200},SAVE='ashen1c';
const TOUCH=matchMedia('(pointer:coarse)').matches,vv=window.visualViewport;
let tab='all',isOpen=false,keep=false,pend=false,hist=[],hi=-1,lastT=0,lastM='',lastMT=0,seq=0,welcomed=false;
const seen=new Set(),ign=new Set();
const ME={id:'local-'+(Math.random()*1e9|0).toString(36),name:'모험가'+(1000+(Math.random()*9000|0))};
try{const d=JSON.parse(localStorage.getItem(SAVE));if(d){if(d.name)ME.name=String(d.name).slice(0,12);if(d.id)ME.id=d.id;if(Array.isArray(d.ign))d.ign.forEach(n=>ign.add(n))}}catch(e){}

const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h},hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const CHAT={me:ME,filter:t=>t/* 욕설 필터 자리: 나중에 여기서 치환 */,net:{mode:'local',connect(){return Promise.resolve()},send(){return Promise.resolve()},history(){return Promise.resolve([])}}};
function recv(m){
  if(!m||typeof m.text!=='string'||!m.text)return;

  const el=document.createElement('div');el.className='ln';el._m=m;el._t=Date.now();

  if(m.ch==='chat'){const b=document.createElement('b');b.style.fontWeight='400';b.style.color=m.uid===ME.id?'#7dffe0':'hsl('+hue(m.name)+' 65% 72%)';b.textContent=m.name+': ';if(m.uid){b.style.cursor='pointer';b.title='정보 보기';b.addEventListener('pointerdown',e=>e.preventDefault());b.addEventListener('click',()=>{try{AF.showProfile(m.uid,m.name)}catch(e){}})}el.appendChild(b)}
  const tx=document.createElement('span');if(m.ch==='sys')tx.style.color=m.c||'#ffd98a';tx.textContent=m.text;el.appendChild(tx);
  if(!TABS.find(x=>x.id===tab).f(m))el.style.display='none';
  lg.insertBefore(el,lg.firstChild);/* column-reverse: 첫 자식이 맨 아래 줄 */
  while(lg.children.length>LIM.keep)lg.removeChild(lg.lastChild)}
const sys=(t,c)=>recv({ch:'sys',text:String(t),c});
function cmd(t){const p=t.slice(1).split(' '),c=p[0].toLowerCase(),a=p.slice(1).join(' ').trim();

  else if(c==='name'){if(AF.user){sys('닉네임은 타이틀 화면의 \'닉네임 변경\'에서 바꿀 수 있어요.','#ff9a8a');return}if(!/^[가-힣A-Za-z0-9_]{2,12}$/.test(a))sys('이름은 2~12자, 한글·영문·숫자·_ 만 쓸 수 있어요.','#ff9a8a');else{ME.name=a;saveMe();sys('이름을 '+a+'(으)로 바꿨어요.')}}
  else if(c==='ignore'){if(!a||a===ME.name)sys('차단할 이름을 적어 주세요. 예) /ignore 이름','#ff9a8a');else{ign.add(a);saveMe();sys(a+' 님의 채팅을 숨겨요.')}}

  else sys('알 수 없는 명령어예요.','#ff9a8a')}
function submit(raw){let t=raw.replace(/\s+/g,' ').trim();if(!t)return;
  hist.unshift(t);if(hist.length>30)hist.length=30;hi=-1;
  if(t[0]==='/'){cmd(t);return}
  const now=Date.now();
  if(now-lastT<LIM.gap){sys('너무 빨리 보내고 있어요.','#ff9a8a');return}
  if(t===lastM&&now-lastMT<LIM.dup){sys('같은 말을 반복해서 보낼 수 없어요.','#ff9a8a');return}

/* ===== 새 메시지 뱃지 — 실시간 연결은 늘리지 않아요.

   ② 그 밖에는 1분에 한 번 chat_latest() 로 '가장 최근 채팅 번호'만 물어봐요(요청 1번, 접속자 수 heartbeat 와 같은 주기). ===== */
let nbSeen=null,nbLat=0,nbT=0,nbOff=0,nbBusy=0;

function nbDraw(){const n=nbSeen==null?0:Math.max(0,nbLat-nbSeen);nbEl.textContent=n>99?'99+':n;nbBtn.classList.toggle('nw',n>0&&!isOpen)}
function nbNote(id,read){if(id>nbLat)nbLat=id;if(nbSeen==null)nbSeen=read?nbLat:id-1;if(read)nbSeen=nbLat;nbDraw()}
async function nbPoll(){const sb=AF.sb;if(nbOff||nbBusy||isOpen||document.hidden||!sb||!AF.user||AF.st!==1)return;if(Date.now()-nbT<55000)return;nbT=Date.now();nbBusy=1;

  catch(e){if(e&&(e.code==='PGRST202'||e.code==='42883'||e.code==='42501'))nbOff=1}finally{nbBusy=0}}
/* 서버 함수가 아직 없으면(chat_latest 미생성) 조용히 꺼져요 */

function open(byClick){if(isOpen)return;isOpen=true;nbSeen=nbLat;nbDraw();chWake();keep=TOUCH||byClick===true;box.classList.add('on');for(const k in AF.K)AF.K[k]=0;inp.value='';hi=-1;place();try{inp.focus({preventScroll:true})}catch(e){inp.focus()}lg.scrollTop=0;setTimeout(place,120);setTimeout(place,350)}
function close(){if(!isOpen)return;isOpen=false;nbSeen=nbLat;nbDraw();chSleep();pend=false;box.classList.remove('on');inp.value='';inp.blur();lg.style.height='';place();setTimeout(()=>dispatchEvent(new Event('resize')),350)}
/* 키보드가 올라오면(visualViewport) 채팅창을 키보드 바로 위로 올리고, 화면이 낮으면 로그 높이를 줄여요 */
function place(){const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  if(isOpen){const kb=M_max(0,innerHeight-h-top);box.style.bottom=(kb>60?kb+6:(hud.offsetHeight||110)+8)+'px';lg.style.height=Math.max(56,Math.min(150,h-130))+'px'}
  else box.style.bottom=((hud.offsetHeight||110)+8)+'px'}
const M_max=Math.max;
function setTab(id){tab=id;const f=TABS.find(x=>x.id===id).f;for(const el of lg.children)el.style.display=f(el._m)?'':'none';for(const i of ct.children)i.classList.toggle('sel',i.dataset.t===id)}
TABS.forEach(x=>{const i=document.createElement('i');i.dataset.t=x.id;i.textContent=x.n;i.addEventListener('pointerdown',e=>{e.preventDefault();setTab(x.id);if(isOpen)inp.focus()});ct.appendChild(i)});setTab('all');
function send(){const v=inp.value;inp.value='';if(!keep)close();if(v.trim())submit(v);if(keep&&isOpen)setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},0)}
/* 입력창 키: 게임 조작키(Z X C Space …)가 채팅 글자와 겹치지 않도록 이벤트를 여기서 끊어요 */
inp.addEventListener('keydown',e=>{e.stopPropagation();
  if(e.isComposing||e.keyCode===229){if(e.key==='Enter')pend=true;return}/* 한글 조합 중 Enter: 조합이 끝난 뒤 보내요 */
  if(e.key==='Enter'){e.preventDefault();send()}
  else if(e.key==='Escape'){e.preventDefault();close()}
  else if(e.key==='Tab'){e.preventDefault();const i=TABS.findIndex(x=>x.id===tab);setTab(TABS[(i+(e.shiftKey?TABS.length-1:1))%TABS.length].id)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}else{hi=-1;inp.value=''}}});
inp.addEventListener('keyup',e=>e.stopPropagation());
inp.addEventListener('compositionend',()=>{if(pend){pend=false;setTimeout(send,0)}});
addEventListener('keydown',e=>{if(e.code!=='Enter'&&e.code!=='NumpadEnter')return;if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||AF.st!==1)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='BUTTON'))return;if(document.querySelector('.ov.on'))return;
  e.preventDefault();open()});
$('chtg').addEventListener('click',e=>{e.preventDefault();open(true)});
$('chf').addEventListener('submit',e=>{e.preventDefault();send()});/* 모바일 키보드의 '보내기/완료' 키 */
$('chs').addEventListener('pointerdown',e=>e.preventDefault());$('chs').addEventListener('click',()=>send());
$('chx').addEventListener('pointerdown',e=>e.preventDefault());$('chx').addEventListener('click',()=>close());
if(vv){vv.addEventListener('resize',place);vv.addEventListener('scroll',place)}
inp.placeholder=TOUCH?'메시지 입력':'Enter 전송 · Esc 닫기';
document.addEventListener('pointerdown',e=>{if(isOpen&&!box.contains(e.target))close()});
setInterval(()=>{const now=Date.now();for(const el of lg.children)if(!el._fd&&now-el._t>9000){el._fd=1;el.classList.add('fd')}
  place();
  },500);
CHAT.recv=recv;CHAT.sys=sys;CHAT.open=open;CHAT.close=close;CHAT.isOpen=()=>isOpen;
CHAT.start=()=>Promise.resolve(CHAT.net.connect(recv)).then(()=>CHAT.net.history('chat',50)).then(h=>{(h||[]).slice().reverse().forEach(recv)}).catch(()=>sys('채팅 서버에 연결하지 못했어요.','#ff9a8a'));
AF.CHAT=CHAT;AF.chatSys=sys;
const row=x=>({id:x.id,ch:'chat',uid:x.uid,name:x.name,text:x.text,ts:Date.parse(x.created_at)});let chCh=null;
/* 실시간(Realtime)은 로그인한 사람만 써요: 로그인 전에는 채널·전송 코드가 아예 실행되지 않아요(supabase-js 는 채널을 만들 때 처음 연결해요).
   서버에서 막는 건 server_lockdown.sql — RT_PRIVATE 는 그 파일의 '선택 2단계'까지 마친 뒤에만 true 로 바꾸세요. */
const RT_PRIVATE=false;
function goNet(){const sb=AF.sb,u=AF.user;if(!sb||!u)return;if(chCh&&ME.id===u.id&&CHAT.net.mode==='supabase')return;ME.id=u.id;ME.name=String(AF.nk||u.name).slice(0,12);
  CHAT.net={mode:'supabase',
    connect(on){if(chCh)sb.removeChannel(chCh);chCh=sb.channel('chat',RT_PRIVATE?{config:{private:true}}:{}).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>on(row(p.new))).subscribe();return Promise.resolve()},
    send(m){if(!AF.user)return Promise.reject(new Error('login'));const go=b=>sb.from('chat_messages').insert(b).select().single();/* 닉네임을 같이 보내 보고, 서버가 name 을 거부하면 이름 없이 다시 보내요(서버가 이름을 정하는 경우) */
      return go({text:m.text,name:ME.name}).then(r=>r.error?go({text:m.text}):r).then(r=>{if(r.error)throw r.error;recv(row(r.data))})},
    history(ch,n){return sb.from('chat_messages').select().eq('ch',ch).order('id',{ascending:false}).limit(n).then(r=>{if(r.error)throw r.error;return(r.data||[]).map(row)})}};
  if(isOpen)chWake()}
window.addEventListener('af-user',goNet);window.addEventListener('af-nick',()=>{if(AF.user&&AF.nk){ME.name=String(AF.nk).slice(0,12);saveMe()}});goNet();
/* 로그 절약: 탭이 1분 넘게 숨겨지면 실시간 연결을 끊고, 돌아오면 다시 연결해요 */
let hidT=0,slT=0;
function chWake(){clearTimeout(slT);if(!chCh&&CHAT.net.mode==='supabase')CHAT.start()}
function chDrop(){if(chCh&&AF.sb){try{AF.sb.removeChannel(chCh)}catch(e){}chCh=null}}
function chSleep(){clearTimeout(slT);slT=setTimeout(()=>{if(!isOpen)chDrop()},90000)}
/* 로그 절약: 채팅창을 열었을 때만 실시간 연결하고, 닫고 90초 뒤·탭이 1분 넘게 숨겨지면 끊어요 */
document.addEventListener('visibilitychange',()=>{clearTimeout(hidT);if(document.hidden){hidT=setTimeout(chDrop,60000)}else if(isOpen)chWake()});
})();
</script><script>
/* ===== 새 버전 알림: 새로 배포되면 접속 중인 사람에게 새로고침 버튼을 띄워요 ===== */
(function(){if(location.protocol==='file:')return;
const B=(document.querySelector('meta[name=build]')||{}).content||'',RE=/<meta name="build" content="([^"]*)"/,A=window.AF||{};let base=null,shown=0,lastC=0;
const fnv=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
function banner(){if(shown)return;shown=1;const d=document.createElement('div');d.id='upd';d.innerHTML='<span>새 버전이 나왔어요</span><button type="button">새로고침</button><i title="나중에">✕</i>';
  d.querySelector('button').onclick=()=>{try{if(A.st==1)A.save()}catch(e){}location.reload()};
  d.querySelector('i').onclick=()=>{d.remove();shown=0};document.body.appendChild(d)}
async function chk(first){lastC=Date.now();try{const r=await fetch(location.pathname+'?_='+lastC,{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=RE.exec(t),rb=m?m[1]:'',h=fnv(t),diff=!!(B&&rb&&rb!==B);
  if(first){if(diff){if(A.st!==1&&sessionStorage.getItem('afv')!==rb){sessionStorage.setItem('afv',rb);location.reload();return}banner();return}base=h;return}
  if(base===null)base=h;if(diff||h!==base)banner()}catch(e){}}
A.chkUpdate=()=>chk(false);chk(true);
setInterval(()=>{if(!document.hidden&&Date.now()-lastC>290000)chk(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastC>60000)chk(false)});
})();
</script>
</body></html>
