   · 보상은 서버가 '이번에 새로 수령 처리한 건수'를 돌려줄 때만 AF.refGrant 로 지급해요 → 중복 수령은 서버에서 막혀요
   · 서버는 저장된 game_saves 의 스테이지를 보고 판정하므로, 확인 전에 현재 진행을 먼저 저장·업로드해요 */
let refCode=null,refCnt=null,refMsg='',refBusy=0,refRun=0,refLast=0,refOff=0;
const refUK=()=>'ashen_refu_'+(AF.user?AF.user.id:'');
const refDone=()=>{try{return !!localStorage.getItem(refUK())}catch(e){return false}};
const refCK=()=>'ashen_refc_'+(AF.user?AF.user.id:''),refCl=()=>{try{return !!localStorage.getItem(refCK())}catch(e){return false}};/* 추천받은 보상을 이미 받았는지(기기 기록) */
const refMiss=e=>{const m=String((e&&e.message)||'');return !!(e&&(e.code==='PGRST202'||e.code==='42883'||/Could not find the function|does not exist/i.test(m)))};
function refPaint(){const c=rf.querySelector('#o-ref');if(!c)return;
  if(!AF.user||!sb||refOff){c.innerHTML='<div class="or"><span>'+(refOff?'추천인 기능을 준비 중이에요':'로그인하면 이용할 수 있어요')+'</span></div>';return}
  const keep=c.querySelector('#o-refi'),val=keep?keep.value:'',fa=document.activeElement,fk=fa&&c.contains(fa)?(fa.id?'#'+fa.id:fa.dataset.a?'[data-a="'+fa.dataset.a+'"]':''):'';
  c.innerHTML=''
   +'<div class="or"><span>내 추천 코드<small>친구가 가입 3일 안에 입력하고 스테이지 5에 도달하면 월드보스 코인 +10 (주 10명까지)</small></span><b style="min-width:92px;letter-spacing:.08em">'+esc(refCode||'…')+'</b><button class="tg on" data-a="ref-copy"'+(refCode?'':' disabled')+'>복사</button></div>'
   +(refCnt?'<div class="or"><span>누적 추천<small>내 코드로 등록한 사람 · 스테이지 5 달성 '+refCnt.d.toLocaleString('ko-KR')+'명</small></span><b style="min-width:92px">'+refCnt.t.toLocaleString('ko-KR')+'명</b></div>':'')
    +'<div class="or"><span>초대 링크<small>친구가 이 주소로 들어와 로그인하면 코드가 자동으로 등록돼요</small></span><button class="tg on" data-a="ref-link"'+(refCode?'':' disabled')+'>링크 복사</button></div>'
   +(refDone()?'<div class="or"><span>추천인 등록 완료<small>스테이지 5에 도달하면 골드 + 고급 장비를 받아요</small></span></div>'
     :'<div class="or"><span>추천인 코드 입력<small>가입 3일 이내 계정만 · 보상: 골드 + 고급 장비 1개</small></span><input id="o-refi" type="text" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="코드" style="width:104px;height:32px;box-sizing:border-box;padding:0 8px;border:1px solid #6b5228;border-radius:6px;background:#070b0e;color:#fff2c4;font:16px \'Do Hyeon\',sans-serif;outline:0;text-transform:uppercase;-webkit-user-select:text;user-select:text"><button class="tg" data-a="ref-use"'+(refBusy?' disabled':'')+'>등록</button></div>')
   +(refMsg?'<div class="or"><span style="color:#ffd98a">'+esc(refMsg)+'</span></div>':'');
  const ni=c.querySelector('#o-refi');if(ni){const pv=val||refPend();if(pv)ni.value=pv}
  if(fk){const n=c.querySelector(fk);if(n&&!n.disabled)n.focus({preventScroll:true})}}
async function refCount(){if(!sb||!AF.user||refOff)return;try{const r=await sb.rpc('referral_count');if(!r.error&&r.data){refCnt={t:r.data.total|0,d:r.data.done|0};if(rf.classList.contains('on'))refPaint()}}catch(e){}}
window.addEventListener('af-user',()=>{refCnt=null});
async function refOpen(){refMsg='';refPaint();if(!sb||!AF.user||refOff)return;refCount();if(refCode)return;
  try{const r=await sb.rpc('referral_code');if(r.error)throw r.error;refCode=String(r.data||'')}catch(e){if(refMiss(e))refOff=1;else refMsg='코드를 불러오지 못했어요'}refPaint()}
const refLink=()=>location.origin+location.pathname+'?ref='+encodeURIComponent(refCode);
function refCopy(link){if(!refCode)return;const txt=link?refLink():refCode,ok=()=>{refMsg=link?'초대 링크를 복사했어요':'복사했어요';refPaint()};

async function refUse(){if(refBusy||!sb||!AF.user)return;const i=rf.querySelector('#o-refi'),v=(i&&i.value||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4,12}$/.test(v)){refMsg='코드는 영문·숫자예요. 한/영 키를 확인해 주세요';refPaint();return}

    refMsg=refRes[s]||'등록하지 못했어요';
    if(s=='ok'||s=='used'){try{localStorage.setItem(refUK(),'1')}catch(e){}refLast=0}}
  catch(e){refMsg=refMiss(e)?'추천인 기능을 준비 중이에요':'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요'}
  refBusy=0;refPaint()}
/* 보상 확인: 게임 중에만, 2분마다 (등록·로그인 직후엔 바로) */
async function refTick(){if(!sb||!AF.user||!AF.synced||refOff||refRun||AF.st!=1)return;refRun=1;refLast=Date.now();
  try{if(refDone()&&!refCl()){try{AF.save()}catch(e){}try{await cloudUp(true)}catch(e){}}/* 내가 추천받아 보상 대기 중일 때만 먼저 서버 저장을 올려요 → 그 외 유저의 서버 저장 횟수는 그대로예요 */
    const r=await sb.rpc('referral_claim');if(r.error)throw r.error;const d=r.data||{};
    if((d.me|0)>0||(d.n|0)>0){if((d.me|0)>0){try{localStorage.setItem(refCK(),'1')}catch(e){}}AF.refGrant(d.me,d.n);refCount();setTimeout(()=>AF.pubFlush(),11000);if(rf.classList.contains('on'))refPaint()}}
  catch(e){if(refMiss(e))refOff=1}

/* 초대 링크로 들어온 코드 자동 등록: 로그인 + 서버 저장 확인이 끝난 뒤에 해요. 실패(네트워크)하면 15초 뒤 다시, 한 번 접속에 최대 3번까지만 */
let refAutoRun=0,refAutoN=0;
async function refAuto(){const v=refPend();if(!v||refAutoRun||refAutoN>=3||!sb||!AF.user||!AF.synced||refOff)return;
  if(refDone()){refPendSet('');return}
  refAutoRun=1;refAutoN++;

    refPendSet('');

    if(s!='used'){try{AF.toast('추천인 · '+(refRes[s]||'등록하지 못했어요'),s=='ok'?'#7dffe0':'#ff7a7a')}catch(e){}}
    if(rf.classList.contains('on'))refPaint()}
  catch(e){if(refMiss(e))refOff=1}
  finally{refAutoRun=0}}
window.addEventListener('af-nick',()=>{refAuto()});
setInterval(refAuto,15000);
window.addEventListener('af-user',()=>{refCode=null;refMsg='';refLast=0;refAutoN=0;refPaint()});
/* ===== 문의하기 (서버: inquiry.sql 의 submit_inquiry · my_inquiries · inquiry_seen) =====
   · 로그인한 사람만 · 보내는 간격·하루 횟수는 서버가 판정해요(화면의 카운트다운은 표시용)
   · 답변은 Supabase 표(inquiries)의 reply 칸에 적으면 돼요
   · 문의를 한 번이라도 보낸 사람만, 접속할 때 1번 답변 도착 여부를 확인해요(나머지 유저는 요청 0) */
const IQC=['버그','건의','기타'],IQK=['bug','idea','etc'];
let iqCat=0,iqBusy=0,iqReady=0,iqLeft=0,iqMax=3,iqRows=null,iqAt=0,iqErr='',iqT=0,iqOp=null,iqDraft='',iqOff=0,iqMk=0,iqChk=0;
const iqUK=()=>'ashen_inq_'+(AF.user?AF.user.id:'');
async function iqRpc(f,a){const r=await sb.rpc(f,a);if(r.error)throw r.error;return r.data}
function iqApply(d){d=d||{};iqRows=Array.isArray(d.rows)?d.rows:[];iqLeft=d.left|0;iqMax=(d.max|0)||3;iqReady=Date.now()+(d.wait|0)*1000;iqAt=Date.now();iqMk=0;iqErr=''}
const iqD=s=>{const d=new Date(s);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function iqMsg(t,bad){const m=iq.querySelector('#iq-m');if(m){m.textContent=t||'';m.style.color=bad?'#ff9a8a':'#7dffe0'}}
function iqCnt(){const t=iq.querySelector('#iq-t'),n=iq.querySelector('#iq-n');if(t&&n)n.textContent=t.value.length+'/500'}
function iqSt(){const s=iq.querySelector('#iq-st'),b=iq.querySelector('#iq-b');if(!s||!b)return;const w=Math.max(0,Math.ceil((iqReady-Date.now())/1000));let t,ok=1;
  if(iqRows===null&&!iqErr){t='확인 중…';ok=0}
  else if(iqRows===null)t=iqErr;
  else if(iqLeft<=0){t='오늘은 더 보낼 수 없어요 · 내일 0시에 초기화돼요';ok=0}
  else if(w>0){t='다음 문의까지 '+Math.floor(w/60)+'분 '+(w%60)+'초 · 오늘 '+iqLeft+'/'+iqMax+' 남음';ok=0}
  else t='오늘 '+iqLeft+'/'+iqMax+' 남음';
  s.textContent=t;b.disabled=!ok||!!iqBusy;b.textContent=iqBusy?'보내는 중…':'보내기'}
function iqLs(){const c=iq.querySelector('#iq-ls');if(!c)return;
  if(iqRows===null){c.innerHTML='<div class="em">'+esc(iqErr||'불러오는 중…')+'</div>';return}
  if(!iqRows.length){c.innerHTML='<div class="em">아직 보낸 문의가 없어요</div>';return}
  c.innerHTML=iqRows.map(r=>{const rp=r.r&&String(r.r).trim();return '<div class="iqi'+(r.n?' nw':'')+'"><div class="h"><span>'+esc(IQC[IQK.indexOf(r.c)]||'기타')+' · '+iqD(r.t)+'</span>'+(rp?'<i>'+(r.n?'새 답변':'답변 완료')+'</i>':'<span>답변 대기</span>')+'</div><p>'+esc(r.b)+'</p>'+(rp?'<div class="rp"><b>운영자 답변'+(r.rt?' · '+iqD(r.rt):'')+'</b>'+esc(rp)+'</div>':'')+'</div>'}).join('')}
function iqMark(){if(iqMk||!iqRows||!iqRows.some(r=>r.n))return;iqMk=1;iqRpc('inquiry_seen').catch(()=>{})}
function iqBuild(){const on=!!(sb&&AF.user)&&!iqOff;let h='<div class="pn wide"><h2>문의하기</h2><div class="st">버그 제보나 건의를 남겨 주세요</div>';
  if(!on)h+='<div class="or"><span>'+(iqOff?'문의 기능을 준비 중이에요':'로그인하면 이용할 수 있어요')+'<small>'+(iqOff?'잠시 후 다시 확인해 주세요':'악용을 막기 위해 로그인한 계정만 보낼 수 있어요')+'</small></span></div>';
  else h+='<div class="or" id="iq-cs" style="gap:6px;border-top:0">'+IQC.map((n,i)=>'<button class="tg'+(i==iqCat?' on':'')+'" data-a="iq-c'+i+'" style="flex:1;min-width:0">'+n+'</button>').join('')+'</div>'
    +'<textarea id="iq-t" maxlength="500" rows="5" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="내용을 적어 주세요 (5~500자)&#10;버그라면 어떤 상황에서 생겼는지 알려 주세요"></textarea>'
    +'<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#9fb5b0"><span id="iq-st"></span><span id="iq-n">0/500</span></div>'
    +'<div id="iq-m" style="min-height:18px;margin-top:4px;font-size:14px;color:#ffd98a"></div>'
    +'<div class="mb" style="margin:6px auto 0;width:100%"><button class="rw" data-a="iq-send" id="iq-b">보내기</button></div><h3>내 문의</h3><div id="iq-ls"></div>';
  h+='<div class="mb bk"><button class="pri" data-a="iq-x">돌아가기</button></div></div>';iq.innerHTML=h;
  const t=iq.querySelector('#iq-t');if(t){t.value=iqDraft;iqCnt()}iqSt();iqLs()}
async function iqLoad(force){if(!sb||!AF.user||iqOff)return;
  if(!force&&iqRows&&Date.now()-iqAt<20000){iqSt();iqLs();iqMark();return}
  try{iqApply(await iqRpc('my_inquiries'))}catch(e){if(refMiss(e)){iqOff=1;iqBuild();return}iqErr='불러오지 못했어요'}
  iqSt();iqLs();iqMark()}
function openInq(from){iqOp=from;iqBuild();iq.classList.add('on');focusFirst(iq);clearInterval(iqT);iqT=setInterval(iqSt,1000);iqLoad()}
function closeInq(){iq.classList.remove('on');clearInterval(iqT);const b=iqOp&&iqOp.isConnected?iqOp:null;b?b.focus({preventScroll:true}):focusFirst(om)}
iq.addEventListener('input',e=>{if(e.target.id=='iq-t'){iqDraft=e.target.value;iqCnt()}});
async function iqSend(){if(iqBusy||!sb||!AF.user)return;const t=iq.querySelector('#iq-t');if(!t)return;const v=t.value.replace(/\r/g,'').trim();
  if(v.length<5){iqMsg('5자 이상 적어 주세요',1);return}
  iqBusy=1;iqMsg('');iqSt();
  try{const d=await iqRpc('submit_inquiry',{p_cat:IQK[iqCat],p_body:v,p_info:{stage:AF.stage,lv:AF.P.lv,cp:AF.cp(),build:(document.querySelector('meta[name=build]')||{}).content||'',ua:navigator.userAgent}});
    iqApply(d);iqDraft='';t.value='';iqCnt();try{localStorage.setItem(iqUK(),'1')}catch(e){}iqMsg('문의를 보냈어요! 답변이 달리면 접속할 때 알려 드려요')}
  catch(e){const m=String((e&&e.message)||'');
    if(m.indexOf('cooldown:')==0){iqReady=Date.now()+(+m.slice(9)||0)*1000;iqMsg('아직 보낼 수 없어요. 잠시 후 다시 시도해 주세요',1)}
    else if(m=='daily'){iqLeft=0;iqMsg('오늘 보낼 수 있는 횟수를 모두 썼어요',1)}
    else if(m=='len')iqMsg('5~500자로 적어 주세요',1);
    else if(refMiss(e)){iqOff=1;iqBuild()}
    else iqMsg('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요',1)}
  iqBusy=0;iqSt();iqLs()}
async function iqCheck(){if(iqChk||!sb||!AF.user||!AF.synced||iqOff)return;let f=null;try{f=localStorage.getItem(iqUK())}catch(e){}if(!f)return;iqChk=1;

  catch(e){if(refMiss(e))iqOff=1}}

<script>
/* ===== 채팅 (뼈대) — PC 게임식: Enter로 입력창 열기, Enter 전송, Esc 닫기, ↑↓ 이전 입력, Tab 탭 전환 =====
   지금은 서버 없이 이 브라우저 안에서만 동작해요(로컬 모드). 서버는 아래 ChatNet 자리만 갈아 끼우면 돼요.

   ▼ Supabase 연결 메모 (나중에)
   create table chat_messages(
     id bigint generated always as identity primary key,
     ch text not null default 'chat',
     uid uuid not null default auth.uid(),
     name text not null check (char_length(name) between 2 and 12),
     text text not null check (char_length(text) between 1 and 100),
     created_at timestamptz not null default now());
   alter table chat_messages enable row level security;
   -- 읽기: 로그인 유저 전체 · 쓰기: uid = auth.uid() 인 본인 것만 · 수정/삭제 없음
   alter publication supabase_realtime add table chat_messages;
   CHAT.net = {
     mode:'supabase',
     connect(onMsg){ sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},
                       p=>onMsg({id:p.new.id,ch:p.new.ch,uid:p.new.uid,name:p.new.name,text:p.new.text,ts:Date.parse(p.new.created_at)})).subscribe(); return Promise.resolve() },
     send(m){ return sb.from('chat_messages').insert({ch:m.ch,name:m.name,text:m.text}).then(r=>{ if(r.error) throw r.error }) },
     history(ch,n){ return sb.from('chat_messages').select().eq('ch',ch).order('id',{ascending:false}).limit(n).then(r=>(r.data||[]).map(x=>({id:x.id,ch:x.ch,uid:x.uid,name:x.name,text:x.text,ts:Date.parse(x.created_at)}))) } };
   CHAT.me.id = 로그인한 유저 id · CHAT.me.name = 닉네임 · CHAT.start() 를 다시 호출하면 연결돼요.
   서버 쪽에서도 길이·도배 제한을 꼭 걸어 주세요(클라이언트 제한은 우회 가능). */
(function(){
const $=id=>document.getElementById(id),box=$('cht'),lg=$('chlg'),ct=$('chct'),inp=$('chin'),hud=$('hud');
const TABS=[{id:'all',n:'전체',f:()=>true},{id:'chat',n:'채팅',f:m=>m.ch==='chat'},{id:'sys',n:'시스템',f:m=>m.ch==='sys'}];/* 탭 추가: 길드·귓속말 등은 여기 한 줄 + 메시지의 ch 값만 늘리면 돼요 */
const LIM={len:100,gap:1000,dup:5000,keep:200},SAVE='ashen1c';
const TOUCH=matchMedia('(pointer:coarse)').matches,vv=window.visualViewport;
let tab='all',isOpen=false,keep=false,pend=false,hist=[],hi=-1,lastT=0,lastM='',lastMT=0,seq=0,welcomed=false;
const seen=new Set(),ign=new Set();
const ME={id:'local-'+(Math.random()*1e9|0).toString(36),name:'모험가'+(1000+(Math.random()*9000|0))};
try{const d=JSON.parse(localStorage.getItem(SAVE));if(d){if(d.name)ME.name=String(d.name).slice(0,12);if(d.id)ME.id=d.id;if(Array.isArray(d.ign))d.ign.forEach(n=>ign.add(n))}}catch(e){}
